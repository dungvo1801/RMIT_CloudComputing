AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Group Expense Splitter - serverless application (API Gateway, Lambda,
  DynamoDB, S3, CloudFront, Cognito, Glue/Athena) - RMIT Cloud Computing
  Assessment 3.

Parameters:
  ProjectName:
    Type: String
    Default: expense-splitter
  LabRoleArn:
    Type: String
    Description: >
      Pre-existing IAM role ARN to use as every Lambda's execution role.
      Required on AWS Academy Learner Lab accounts, which forbid creating
      new IAM roles (leave as-is - it targets the account's LabRole).
    Default: arn:aws:iam::864419282671:role/LabRole

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        TABLE_NAME: !Ref ExpenseTable

Resources:
  # ---------------------------------------------------------------------
  # Shared Lambda layer (common/db/split/response helpers)
  # ---------------------------------------------------------------------
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${ProjectName}-common"
      ContentUri: backend/layers/common/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  # ---------------------------------------------------------------------
  # Auth: Cognito User Pool (used by API Gateway JWT authorizer)
  # ---------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-web-client"
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false

  # ---------------------------------------------------------------------
  # API Gateway (HTTP API) with Cognito JWT authorizer
  # ---------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: ["content-type", "authorization"]
        AllowMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoAuthorizer

  # ---------------------------------------------------------------------
  # Auth: user profile row, auto-created right after sign-up confirmation.
  # See UsersTable below re: the `password` column - never a real credential.
  # ---------------------------------------------------------------------
  PreSignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-pre-signup"
      CodeUri: backend/functions/pre_signup/
      Handler: app.handler
      Role: !Ref LabRoleArn
      Events:
        PreSignUp:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PreSignUp

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-post-confirmation"
      CodeUri: backend/functions/post_confirmation/
      Handler: app.handler
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref UsersTable
      Events:
        PostConfirmation:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger: PostConfirmation

  AccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-account"
      CodeUri: backend/functions/account/
      Handler: app.handler
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref UsersTable
      Events:
        PasswordChanged:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /account/password-changed
            Method: PUT

  # ---------------------------------------------------------------------
  # Lambda functions (Compute)
  # ---------------------------------------------------------------------
  GroupsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-groups"
      CodeUri: backend/functions/groups/
      Handler: app.handler
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          RECEIPTS_BUCKET: !Ref ReceiptsBucket
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /groups
            Method: POST
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /groups
            Method: GET
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /groups/{groupId}
            Method: GET
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /groups/{groupId}
            Method: DELETE
        Rename:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /groups/{groupId}
            Method: PUT

  MembersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-members"
      CodeUri: backend/functions/members/
      Handler: app.handler
      Role: !Ref LabRoleArn
      Events:
        AddMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /groups/{groupId}/members
            Method: POST
        RemoveMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /groups/{groupId}/members
            Method: DELETE
        RenameMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /groups/{groupId}/members
            Method: PUT

  TransactionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-transactions"
      CodeUri: backend/functions/transactions/
      Handler: app.handler
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          RECEIPTS_BUCKET: !Ref ReceiptsBucket
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /groups/{groupId}/transactions
            Method: POST
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /groups/{groupId}/transactions
            Method: GET
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /groups/{groupId}/transactions/{txnId}
            Method: PUT
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /groups/{groupId}/transactions/{txnId}
            Method: DELETE

  BalancesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-balances"
      CodeUri: backend/functions/balances/
      Handler: app.handler
      Role: !Ref LabRoleArn
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /groups/{groupId}/balances
            Method: GET

  ReceiptsUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-receipts-upload-url"
      CodeUri: backend/functions/receipts_upload_url/
      Handler: app.handler
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          RECEIPTS_BUCKET: !Ref ReceiptsBucket
      Events:
        GetUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /receipts/upload-url
            Method: POST
        GetViewUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /receipts/view-url
            Method: GET

  StreamExportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-stream-export"
      CodeUri: backend/functions/stream_export/
      Handler: app.handler
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          ANALYTICS_BUCKET: !Ref AnalyticsBucket
      Events:
        StreamTrigger:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ExpenseTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 2

  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-reports"
      CodeUri: backend/functions/reports/
      Handler: app.handler
      Role: !Ref LabRoleArn
      Timeout: 60
      Environment:
        Variables:
          ATHENA_DATABASE: !Ref GlueDatabase
          ATHENA_OUTPUT_LOCATION: !Sub "s3://${AnalyticsBucket}/athena-results/"
          ATHENA_WORKGROUP: !Ref AthenaWorkGroup
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /groups/{groupId}/reports
            Method: GET

  # ---------------------------------------------------------------------
  # DynamoDB (Database) - single-table design, streams feed the analytics pipeline
  # ---------------------------------------------------------------------
  ExpenseTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # Separate user-profile table (distinct from the app's single-table
  # store above), auto-populated by PostConfirmationFunction on sign-up.
  # NOTE: the `password` attribute is a fixed placeholder string, never a
  # real credential - see backend/functions/post_confirmation/app.py.
  # Actual authentication is handled entirely by Cognito (UserPool above).
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-users-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  # ---------------------------------------------------------------------
  # S3 (Storage): static site, receipt images, analytics data lake
  # ---------------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-site-${AWS::AccountId}-${AWS::Region}"
      # NOTE: served via S3 Static Website Hosting (public bucket), not CloudFront.
      # CloudFront (cloudfront:CreateDistribution / CreateOriginAccessControl) is
      # explicitly denied on this AWS Academy Learner Lab account - see the
      # "Design decisions" note in docs/Solution_Architecture_Document.md.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"

  ReceiptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-receipts-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [PUT, GET]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  AnalyticsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-analytics-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------------------------------------------------------------------
  # Analytics (Glue Data Catalog + Athena) over the DynamoDB Streams export
  # ---------------------------------------------------------------------
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "${ProjectName}_analytics"

  TransactionsGlueTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: transactions
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
        StorageDescriptor:
          Location: !Sub "s3://${AnalyticsBucket}/transactions/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
          Columns:
            - { Name: txn_id, Type: string }
            - { Name: group_id, Type: string }
            - { Name: group_name, Type: string }
            - { Name: payer, Type: string }
            - { Name: amount, Type: double }
            - { Name: currency, Type: string }
            - { Name: original_amount, Type: double }
            - { Name: exchange_rate, Type: double }
            - { Name: description, Type: string }
            - { Name: category, Type: string }
            - { Name: split_among, Type: array<string> }
            - { Name: is_settlement, Type: boolean }
            - { Name: payee, Type: string }
            - { Name: created_at, Type: string }
            - { Name: year, Type: string }
            - { Name: month, Type: string }

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${ProjectName}-workgroup"
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        ResultConfiguration:
          OutputLocation: !Sub "s3://${AnalyticsBucket}/athena-results/"

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  SiteBucketName:
    Value: !Ref SiteBucket
  ReceiptsBucketName:
    Value: !Ref ReceiptsBucket
  AnalyticsBucketName:
    Value: !Ref AnalyticsBucket
  SiteWebsiteUrl:
    Description: Public S3 static website URL for the frontend
    Value: !GetAtt SiteBucket.WebsiteURL
  DynamoDBTableName:
    Value: !Ref ExpenseTable
  UsersTableName:
    Value: !Ref UsersTable
  GlueDatabaseName:
    Value: !Ref GlueDatabase
